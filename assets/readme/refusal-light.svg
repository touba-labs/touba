<svg xmlns="http://www.w3.org/2000/svg" width="880" height="182" viewBox="0 0 880 182" role="img" aria-labelledby="title description">
  <title id="title">The compiler rejects a caller that is not listed in callable_by</title>
  <desc id="description">$ touba compile refunds.tb --out refunds.air.json
refunds.tb:36:9-38:1: AgentCallerNotAllowed: `strategy:shop.refunds/RefundEverything`
cannot call agent `agent:shop.refunds/RefundAgent` without a matching `callable_by` rule
$ echo $?
1</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #1f2328; }
    .prompt { fill: #2f63c6; font-weight: 700; }
    .muted { fill: #59636e; }
    .error { fill: #cf222e; font-weight: 700; }
    .file { fill: #59636e; font-size: 12px; }
    .cover { fill: #f6f8fa; }
    .reveal { animation: reveal 0.35s ease-out backwards; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cover, .reveal { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="181" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M1 40 H879" stroke="#d8dee4"/>
  <circle cx="22" cy="20" r="5" fill="#d0d7de"/><circle cx="40" cy="20" r="5" fill="#d0d7de"/><circle cx="58" cy="20" r="5" fill="#d0d7de"/>
  <text class="file" x="82" y="24">terminal</text>
  <text y="73"><tspan class="prompt" x="24">$</tspan><tspan class="ink" x="39.6">touba compile refunds.tb --out refunds.air.json</tspan></text>
  <rect class="cover" x="38.6" y="58" width="370" height="22" style="transform:translateX(370px);animation:t0 1.41s steps(47) 0.40s backwards"/>
  <style>@keyframes t0{from{transform:translateX(0)}to{transform:translateX(370px)}}</style>
  <text class="reveal" style="animation-delay:2.16s" y="95"><tspan class="muted" x="24.0">refunds.tb:36:9-38:1: </tspan><tspan class="error" x="195.6">AgentCallerNotAllowed</tspan><tspan class="ink" x="359.4">: `strategy:shop.refunds/RefundEverything`</tspan></text>
  <text class="reveal" style="animation-delay:2.28s" y="117"><tspan class="ink" x="24.0">cannot call agent `agent:shop.refunds/RefundAgent` without a matching `callable_by` rule</tspan></text>
  <text y="139"><tspan class="prompt" x="24">$</tspan><tspan class="ink" x="39.6">echo $?</tspan></text>
  <rect class="cover" x="38.6" y="124" width="58" height="22" style="transform:translateX(58px);animation:t3 0.21s steps(7) 3.00s backwards"/>
  <style>@keyframes t3{from{transform:translateX(0)}to{transform:translateX(58px)}}</style>
  <text class="reveal" style="animation-delay:3.56s" y="161"><tspan class="error" x="24.0">1</tspan></text>
</svg>
