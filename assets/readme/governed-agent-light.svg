<svg xmlns="http://www.w3.org/2000/svg" width="880" height="704" viewBox="0 0 880 704" role="img" aria-labelledby="title description">
  <title id="title">refunds.tb, an annotated Touba program</title>
  <desc id="description">module shop.refunds

tool IssueRefund
    description "Refund an order through the payment API."
    takes order as Text
    gives Text
    requires network, secret_read
    secrets PAYMENTS_API_KEY

agent RefundAgent
    description "Refund the order and return the receipt."
    takes order as Text
    gives Text
    responsibility "Refund only the supplied order."
    uses IssueRefund
    callable_by strategy HandleRefund

strategy HandleRefund
    takes order as Text
    gives Text
    uses RefundAgent
    do
        human.approve
            with context as order
            with role as "finance"
            into approval
        RefundAgent
            with order as order
            into receipt
        give receipt</desc>
