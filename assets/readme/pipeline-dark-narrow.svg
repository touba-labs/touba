<svg xmlns="http://www.w3.org/2000/svg" width="500" height="461" viewBox="0 0 500 461" role="img" aria-labelledby="title">
  <title id="title">A .tb source is checked by the compiler, compiled to AIR, executed by the runtime and recorded as a structured trace. The host supplies handlers, credentials and identity.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .label { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; font-weight: 600; fill: #e6edf3; }
    .detail { font-size: 12.5px; text-anchor: end; }
    .node { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; }
    .stage .node { animation: lit 6s ease-in-out infinite; animation-delay: inherit; }
    @keyframes lit { 0%, 30%, 100% { stroke: #30363d; } 8%, 18% { stroke: #7ea6ff; } }
    .arrow { stroke: #6e7681; stroke-width: 1.4; fill: none; }
    .head { fill: #6e7681; }
    .packet { fill: #7ea6ff; animation: travel 6s linear infinite; }
    @keyframes travel { 0% { transform: translateY(0); } 66%, 100% { transform: translateY(336px); } }
    .lane { fill: none; stroke: #30363d; stroke-dasharray: 4 4; }
    .lane-text { font-size: 12.5px; text-anchor: middle; }
    .lane-text tspan.strong { fill: #e6edf3; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { .stage .node, .packet { animation: none; } }
  </style>
  <path class="arrow" d="M228 63 V76"/><path class="head" d="M224 75 L228 81 L232 75 Z"/>
  <path class="arrow" d="M228 147 V160"/><path class="head" d="M224 159 L228 165 L232 159 Z"/>
  <path class="arrow" d="M228 231 V244"/><path class="head" d="M224 243 L228 249 L232 243 Z"/>
  <path class="arrow" d="M228 315 V328"/><path class="head" d="M224 327 L228 333 L232 327 Z"/>
  <circle class="packet" cx="228" cy="30" r="4"/>
  <g class="stage" style="animation-delay:-0.78s">
    <rect class="node" x="1" y="1" width="456" height="58" rx="12"/>
    <text class="label" x="20" y="35">.tb source</text>
    <text class="detail" x="438" y="26">typed declarations</text>
    <text class="detail" x="438" y="42">and workflows</text>
  </g>
  <g class="stage" style="animation-delay:0.21s">
    <rect class="node" x="1" y="85" width="456" height="58" rx="12"/>
    <text class="label" x="20" y="119">compiler</text>
    <text class="detail" x="438" y="110">checks contracts</text>
    <text class="detail" x="438" y="126">before execution</text>
  </g>
  <g class="stage" style="animation-delay:1.20s">
    <rect class="node" x="1" y="169" width="456" height="58" rx="12"/>
    <text class="label" x="20" y="203">AIR</text>
    <text class="detail" x="438" y="194">intermediate</text>
    <text class="detail" x="438" y="210">representation</text>
  </g>
  <g class="stage" style="animation-delay:2.19s">
    <rect class="node" x="1" y="253" width="456" height="58" rx="12"/>
    <text class="label" x="20" y="287">runtime</text>
    <text class="detail" x="438" y="278">mediates calls, resources,</text>
    <text class="detail" x="438" y="294">budgets and approvals</text>
  </g>
  <g class="stage" style="animation-delay:3.18s">
    <rect class="node" x="1" y="337" width="456" height="58" rx="12"/>
    <text class="label" x="20" y="371">trace</text>
    <text class="detail" x="438" y="362">structured events</text>
    <text class="detail" x="438" y="378">linked to source</text>
  </g>
  <path class="lane" d="M456 282 H484 V425"/>
  <rect class="lane" x="1" y="425" width="498" height="34" rx="10"/>
  <text class="lane-text" x="250" y="446.5"><tspan class="strong">host application</tspan> · handlers, credentials, identity</text>
</svg>
