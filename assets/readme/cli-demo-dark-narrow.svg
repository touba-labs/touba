<svg xmlns="http://www.w3.org/2000/svg" width="500" height="389" viewBox="0 0 500 389" role="img" aria-label="Touba CLI demo: touba run executes a source file, pauses for a human approval with no tool or model call, then refuses an unauthorized caller before running.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #e6edf3; white-space: pre; }
  .cover { fill: #161b22; animation: 16.404000000000003s linear infinite; }
  .out { opacity: 0; animation: 16.404000000000003s linear infinite; }
  .scene { opacity: 0; animation: 16.404000000000003s ease infinite; }
  .chip { fill: #161b22; stroke: #30363d; }
  .on { fill: none; stroke: #2f63c6; stroke-width: 1.6; opacity: 0; animation: 16.404000000000003s ease infinite; }
  .caption { opacity: 0; animation: 16.404000000000003s ease infinite; }
  .num { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
  .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .big { font-size: 15px; }
  .file { font-size: 12px; fill: #9198a1; }
  @keyframes sc0{0%,1.219%{opacity:0}2.438%,53.694%{opacity:1}55.218%,100%{opacity:0}}
  @keyframes t0_0{0%,3.048%{transform:translateX(0);animation-timing-function:steps(18,end)}5.462%,100%{transform:translateX(145px)}}
  @keyframes o0_1{0%,8.083%{opacity:0}8.815%,100%{opacity:1}}
  @keyframes t0_2{0%,13.875%{transform:translateX(0);animation-timing-function:steps(22,end)}16.825%,100%{transform:translateX(176px)}}
  @keyframes t0_3{0%,17.313%{transform:translateX(0);animation-timing-function:steps(40,end)}22.677%,100%{transform:translateX(316px)}}
  @keyframes t0_4{0%,23.165%{transform:translateX(0);animation-timing-function:steps(49,end)}29.737%,100%{transform:translateX(387px)}}
  @keyframes o0_5{0%,32.358%{opacity:0}33.089%,100%{opacity:1}}
  @keyframes o0_6{0%,32.663%{opacity:0}33.394%,100%{opacity:1}}
  @keyframes o0_7{0%,32.968%{opacity:0}33.699%,100%{opacity:1}}
  @keyframes o0_8{0%,33.272%{opacity:0}34.004%,100%{opacity:1}}
  @keyframes o0_9{0%,33.577%{opacity:0}34.309%,100%{opacity:1}}
  @keyframes o0_10{0%,33.882%{opacity:0}34.614%,100%{opacity:1}}
  @keyframes o0_11{0%,34.187%{opacity:0}34.918%,100%{opacity:1}}
  @keyframes o0_12{0%,34.492%{opacity:0}35.223%,100%{opacity:1}}
  @keyframes sc1{0%,54.913%{opacity:0}56.133%,96.952%{opacity:1}98.476%,100%{opacity:0}}
  @keyframes t1_0{0%,56.742%{transform:translateX(0);animation-timing-function:steps(19,end)}59.290%,100%{transform:translateX(153px)}}
  @keyframes o1_1{0%,61.912%{opacity:0}62.643%,100%{opacity:1}}
  @keyframes o1_2{0%,62.217%{opacity:0}62.948%,100%{opacity:1}}
  @keyframes o1_3{0%,62.521%{opacity:0}63.253%,100%{opacity:1}}
  @keyframes o1_4{0%,62.826%{opacity:0}63.558%,100%{opacity:1}}
  @keyframes o1_5{0%,63.131%{opacity:0}63.862%,100%{opacity:1}}
  @keyframes o1_6{0%,63.436%{opacity:0}64.167%,100%{opacity:1}}
  @keyframes t1_7{0%,69.227%{transform:translateX(0);animation-timing-function:steps(19,end)}71.775%,100%{transform:translateX(153px)}}
  @keyframes o1_8{0%,74.396%{opacity:0}75.128%,100%{opacity:1}}
  @keyframes o1_9{0%,74.701%{opacity:0}75.433%,100%{opacity:1}}
  @keyframes o1_10{0%,75.006%{opacity:0}75.738%,100%{opacity:1}}
  @keyframes o1_11{0%,75.311%{opacity:0}76.042%,100%{opacity:1}}
  @keyframes st0{0%,2.134%{opacity:0}3.658%,11.131%{opacity:1}12.351%,100%{opacity:0}}
  @keyframes st1{0%,12.960%{opacity:0}14.484%,52.170%{opacity:1}53.389%,100%{opacity:0}}
  @keyframes st2{0%,55.828%{opacity:0}57.352%,95.428%{opacity:1}96.647%,100%{opacity:0}}
