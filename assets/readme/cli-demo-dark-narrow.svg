<rect width="500" height="389" fill="#0d1117"/>
<g class="caption" style="animation-name:st0" transform="translate(157.9 8)"><rect width="28" height="28" rx="8" fill="#2f63c6"/><text class="num" x="14" y="19.5">1</text><text class="label big" x="38" y="19.5">Run a source file</text></g><g class="caption still" style="animation-name:st1" transform="translate(157.9 8)"><rect width="28" height="28" rx="8" fill="#2f63c6"/><text class="num" x="14" y="19.5">2</text><text class="label big" x="38" y="19.5">Waits for a human</text></g><g class="caption" style="animation-name:st2" transform="translate(106.30000000000001 8)"><rect width="28" height="28" rx="8" fill="#2f63c6"/><text class="num" x="14" y="19.5">3</text><text class="label big" x="38" y="19.5">Bypass refused before running</text></g>
<rect x="0.5" y="50.5" width="499" height="338" rx="14" fill="#161b22" stroke="#30363d"/>
<path d="M1 86 H499" stroke="#262c34"/>
<circle cx="22" cy="68" r="5" fill="#3d444d"/><circle cx="40" cy="68" r="5" fill="#3d444d"/><circle cx="58" cy="68" r="5" fill="#3d444d"/>
<text class="file" x="82" y="72">~/shop</text>
  <g class="scene still" style="animation-name:sc0">
    <text y="115"><tspan x="22" fill="#7ea6ff" font-weight="700">$</tspan><tspan x="37.6">touba run hello.tb</tspan></text>
    <rect class="cover" x="36.6" y="100" width="145" height="21" style="animation-name:t0_0;transform:translateX(145px)"/>
    <text class="out" y="136" x="22" style="animation-name:o0_1"><tspan>Touba ready</tspan></text>
    <text y="157"><tspan x="22" fill="#7ea6ff" font-weight="700">$</tspan><tspan x="37.6">touba run refunds.tb \</tspan></text>
    <rect class="cover" x="36.6" y="142" width="176" height="21" style="animation-name:t0_2;transform:translateX(176px)"/>
    <text y="178"><tspan x="22">    --inputs-json '{"order":"A-1042"}' \</tspan></text>
    <rect class="cover" x="21" y="163" width="316" height="21" style="animation-name:t0_3;transform:translateX(316px)"/>
    <text y="199"><tspan x="22">    --output run-summary | jq '{status, budgets}'</tspan></text>
    <rect class="cover" x="21" y="184" width="387" height="21" style="animation-name:t0_4;transform:translateX(387px)"/>
    <text class="out" y="220" x="22" style="animation-name:o0_5"><tspan>{</tspan></text>
    <text class="out" y="241" x="22" style="animation-name:o0_6"><tspan>  </tspan><tspan fill="#7ea6ff">"status"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#5fd4b3">"approval_pending"</tspan><tspan>,</tspan></text>
    <text class="out" y="262" x="22" style="animation-name:o0_7"><tspan>  </tspan><tspan fill="#7ea6ff">"budgets"</tspan><tspan>:</tspan><tspan> {</tspan></text>
    <text class="out" y="283" x="22" style="animation-name:o0_8"><tspan>    </tspan><tspan fill="#7ea6ff">"steps_used"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#e6edf3" font-weight="700">1</tspan><tspan>,</tspan></text>
    <text class="out" y="304" x="22" style="animation-name:o0_9"><tspan>    </tspan><tspan fill="#7ea6ff">"tool_calls_used"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#e6edf3" font-weight="700">0</tspan><tspan>,</tspan></text>
    <text class="out" y="325" x="22" style="animation-name:o0_10"><tspan>    </tspan><tspan fill="#7ea6ff">"provider_calls_used"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#e6edf3" font-weight="700">0</tspan></text>
    <text class="out" y="346" x="22" style="animation-name:o0_11"><tspan>  }</tspan></text>
    <text class="out" y="367" x="22" style="animation-name:o0_12"><tspan>}</tspan></text>
  </g>
  <g class="scene" style="animation-name:sc1">
    <text y="115"><tspan x="22" fill="#7ea6ff" font-weight="700">$</tspan><tspan x="37.6">tail -n 6 bypass.tb</tspan></text>
    <rect class="cover" x="36.6" y="100" width="153" height="21" style="animation-name:t1_0;transform:translateX(153px)"/>
    <text class="out" y="136" x="22" style="animation-name:o1_1"><tspan fill="#7ea6ff">strategy</tspan><tspan> </tspan><tspan>RefundEverything</tspan></text>
    <text class="out" y="157" x="22" style="animation-name:o1_2"><tspan>    </tspan><tspan fill="#7ea6ff">takes</tspan><tspan> </tspan><tspan>order</tspan><tspan> </tspan><tspan fill="#7ea6ff">as</tspan><tspan> </tspan><tspan>Text</tspan></text>
    <text class="out" y="178" x="22" style="animation-name:o1_3"><tspan>    </tspan><tspan fill="#7ea6ff">uses</tspan><tspan> </tspan><tspan>RefundAgent</tspan></text>
    <text class="out" y="199" x="22" style="animation-name:o1_4"><tspan>    </tspan><tspan fill="#7ea6ff">do</tspan></text>
    <text class="out" y="220" x="22" style="animation-name:o1_5"><tspan>        </tspan><tspan>RefundAgent</tspan></text>
    <text class="out" y="241" x="22" style="animation-name:o1_6"><tspan>            </tspan><tspan fill="#7ea6ff">with</tspan><tspan> </tspan><tspan>order</tspan><tspan> </tspan><tspan fill="#7ea6ff">as</tspan><tspan> </tspan><tspan>order</tspan></text>
    <text y="262"><tspan x="22" fill="#7ea6ff" font-weight="700">$</tspan><tspan x="37.6">touba run bypass.tb</tspan></text>
    <rect class="cover" x="36.6" y="247" width="153" height="21" style="animation-name:t1_7;transform:translateX(153px)"/>
    <text class="out" y="283" x="22" style="animation-name:o1_8"><tspan fill="#9198a1">~/shop/bypass.tb:36:9-38:1: </tspan><tspan fill="#ff7b72" font-weight="700">AgentCallerNotAllowed</tspan><tspan>:</tspan></text>
    <text class="out" y="304" x="22" style="animation-name:o1_9"><tspan>`strategy:shop.refunds/RefundEverything` cannot call agent</tspan></text>
    <text class="out" y="325" x="22" style="animation-name:o1_10"><tspan>`agent:shop.refunds/RefundAgent` without a matching</tspan></text>
    <text class="out" y="346" x="22" style="animation-name:o1_11"><tspan>`callable_by` rule</tspan></text>
  </g>
</svg>
