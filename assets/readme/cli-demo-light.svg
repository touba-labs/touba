<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" role="img" aria-label="Touba CLI demo: touba run executes a source file, pauses for a human approval with no tool or model call, then refuses an unauthorized caller before running.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #1f2328; white-space: pre; }
  .cover { fill: #f6f8fa; animation: 16.304000000000002s linear infinite; }
  .out { opacity: 0; animation: 16.304000000000002s linear infinite; }
  .scene { opacity: 0; animation: 16.304000000000002s ease infinite; }
  .chip { fill: #f6f8fa; stroke: #d0d7de; }
  .on { fill: none; stroke: #2f63c6; stroke-width: 1.6; opacity: 0; animation: 16.304000000000002s ease infinite; }
  .caption { opacity: 0; animation: 16.304000000000002s ease infinite; }
  .num { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
  .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .big { font-size: 15px; }
  .file { font-size: 12px; fill: #59636e; }
  @keyframes sc0{0%,1.227%{opacity:0}2.453%,54.024%{opacity:1}55.557%,100%{opacity:0}}
  @keyframes t0_0{0%,3.067%{transform:translateX(0);animation-timing-function:steps(18,end)}5.496%,100%{transform:translateX(145px)}}
  @keyframes o0_1{0%,8.133%{opacity:0}8.869%,100%{opacity:1}}
  @keyframes t0_2{0%,13.960%{transform:translateX(0);animation-timing-function:steps(22,end)}16.928%,100%{transform:translateX(176px)}}
  @keyframes t0_3{0%,17.419%{transform:translateX(0);animation-timing-function:steps(40,end)}22.816%,100%{transform:translateX(316px)}}
  @keyframes t0_4{0%,23.307%{transform:translateX(0);animation-timing-function:steps(49,end)}29.919%,100%{transform:translateX(387px)}}
  @keyframes o0_5{0%,32.556%{opacity:0}33.292%,100%{opacity:1}}
  @keyframes o0_6{0%,32.863%{opacity:0}33.599%,100%{opacity:1}}
  @keyframes o0_7{0%,33.170%{opacity:0}33.906%,100%{opacity:1}}
  @keyframes o0_8{0%,33.476%{opacity:0}34.212%,100%{opacity:1}}
  @keyframes o0_9{0%,33.783%{opacity:0}34.519%,100%{opacity:1}}
  @keyframes o0_10{0%,34.090%{opacity:0}34.826%,100%{opacity:1}}
  @keyframes o0_11{0%,34.396%{opacity:0}35.132%,100%{opacity:1}}
  @keyframes o0_12{0%,34.703%{opacity:0}35.439%,100%{opacity:1}}
  @keyframes sc1{0%,55.250%{opacity:0}56.477%,96.933%{opacity:1}98.467%,100%{opacity:0}}
  @keyframes t1_0{0%,57.090%{transform:translateX(0);animation-timing-function:steps(19,end)}59.654%,100%{transform:translateX(153px)}}
  @keyframes o1_1{0%,62.291%{opacity:0}63.027%,100%{opacity:1}}
  @keyframes o1_2{0%,62.598%{opacity:0}63.334%,100%{opacity:1}}
  @keyframes o1_3{0%,62.905%{opacity:0}63.641%,100%{opacity:1}}
  @keyframes o1_4{0%,63.211%{opacity:0}63.947%,100%{opacity:1}}
  @keyframes o1_5{0%,63.518%{opacity:0}64.254%,100%{opacity:1}}
  @keyframes o1_6{0%,63.825%{opacity:0}64.561%,100%{opacity:1}}
  @keyframes t1_7{0%,69.652%{transform:translateX(0);animation-timing-function:steps(19,end)}72.215%,100%{transform:translateX(153px)}}
  @keyframes o1_8{0%,74.853%{opacity:0}75.589%,100%{opacity:1}}
  @keyframes o1_9{0%,75.159%{opacity:0}75.895%,100%{opacity:1}}
  @keyframes st0{0%,1.840%{opacity:0}3.067%,12.120%{opacity:1}13.346%,100%{opacity:0}}
  @keyframes st1{0%,12.733%{opacity:0}13.960%,53.410%{opacity:1}54.637%,100%{opacity:0}}
  @keyframes st2{0%,55.864%{opacity:0}57.090%,96.320%{opacity:1}97.547%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce) { .cover, .out, .scene, .on, .caption { animation: none; } .out, .scene.still, .caption.still { opacity: 1; } .cover { display: none; } }
