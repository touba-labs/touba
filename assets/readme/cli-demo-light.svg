<rect width="880" height="395" fill="#ffffff"/>
<g transform="translate(121.89999999999998 10)"><g transform="translate(0 0)"><rect class="chip" width="175.8" height="32" rx="9"/><rect class="on" style="animation-name:st0" width="175.8" height="32" rx="9"/><rect x="4" y="4" width="24" height="24" rx="7" fill="#2f63c6"/><text class="num" x="16" y="21">1</text><text class="label" x="36" y="21">Run a source file</text></g><g transform="translate(185.8 0)"><rect class="chip" width="175.8" height="32" rx="9"/><rect class="on" style="animation-name:st1" width="175.8" height="32" rx="9"/><rect x="4" y="4" width="24" height="24" rx="7" fill="#2f63c6"/><text class="num" x="16" y="21">2</text><text class="label" x="36" y="21">Waits for a human</text></g><g transform="translate(371.6 0)"><rect class="chip" width="264.6" height="32" rx="9"/><rect class="on" style="animation-name:st2" width="264.6" height="32" rx="9"/><rect x="4" y="4" width="24" height="24" rx="7" fill="#2f63c6"/><text class="num" x="16" y="21">3</text><text class="label" x="36" y="21">Bypass refused before running</text></g></g>
<rect x="0.5" y="56.5" width="879" height="338" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<path d="M1 92 H879" stroke="#d8dee4"/>
<circle cx="22" cy="74" r="5" fill="#d0d7de"/><circle cx="40" cy="74" r="5" fill="#d0d7de"/><circle cx="58" cy="74" r="5" fill="#d0d7de"/>
<text class="file" x="82" y="78">~/shop</text>
  <g class="scene still" style="animation-name:sc0">
    <text y="121"><tspan x="22" fill="#2f63c6" font-weight="700">$</tspan><tspan x="37.6">touba run hello.tb</tspan></text>
    <rect class="cover" x="36.6" y="106" width="145" height="21" style="animation-name:t0_0;transform:translateX(145px)"/>
    <text class="out" y="142" x="22" style="animation-name:o0_1"><tspan>Touba ready</tspan></text>
    <text y="163"><tspan x="22" fill="#2f63c6" font-weight="700">$</tspan><tspan x="37.6">touba run refunds.tb \</tspan></text>
    <rect class="cover" x="36.6" y="148" width="176" height="21" style="animation-name:t0_2;transform:translateX(176px)"/>
    <text y="184"><tspan x="22">    --inputs-json '{"order":"A-1042"}' \</tspan></text>
    <rect class="cover" x="21" y="169" width="316" height="21" style="animation-name:t0_3;transform:translateX(316px)"/>
    <text y="205"><tspan x="22">    --output run-summary | jq '{status, budgets}'</tspan></text>
    <rect class="cover" x="21" y="190" width="387" height="21" style="animation-name:t0_4;transform:translateX(387px)"/>
    <text class="out" y="226" x="22" style="animation-name:o0_5"><tspan>{</tspan></text>
    <text class="out" y="247" x="22" style="animation-name:o0_6"><tspan>  </tspan><tspan fill="#2f63c6">"status"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#0a7c66">"approval_pending"</tspan><tspan>,</tspan></text>
    <text class="out" y="268" x="22" style="animation-name:o0_7"><tspan>  </tspan><tspan fill="#2f63c6">"budgets"</tspan><tspan>:</tspan><tspan> {</tspan></text>
    <text class="out" y="289" x="22" style="animation-name:o0_8"><tspan>    </tspan><tspan fill="#2f63c6">"steps_used"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#1f2328" font-weight="700">1</tspan><tspan>,</tspan></text>
    <text class="out" y="310" x="22" style="animation-name:o0_9"><tspan>    </tspan><tspan fill="#2f63c6">"tool_calls_used"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#1f2328" font-weight="700">0</tspan><tspan>,</tspan></text>
    <text class="out" y="331" x="22" style="animation-name:o0_10"><tspan>    </tspan><tspan fill="#2f63c6">"provider_calls_used"</tspan><tspan>:</tspan><tspan> </tspan><tspan fill="#1f2328" font-weight="700">0</tspan></text>
    <text class="out" y="352" x="22" style="animation-name:o0_11"><tspan>  }</tspan></text>
    <text class="out" y="373" x="22" style="animation-name:o0_12"><tspan>}</tspan></text>
  </g>
  <g class="scene" style="animation-name:sc1">
    <text y="121"><tspan x="22" fill="#2f63c6" font-weight="700">$</tspan><tspan x="37.6">tail -n 6 bypass.tb</tspan></text>
    <rect class="cover" x="36.6" y="106" width="153" height="21" style="animation-name:t1_0;transform:translateX(153px)"/>
    <text class="out" y="142" x="22" style="animation-name:o1_1"><tspan fill="#2f63c6">strategy</tspan><tspan> </tspan><tspan>RefundEverything</tspan></text>
    <text class="out" y="163" x="22" style="animation-name:o1_2"><tspan>    </tspan><tspan fill="#2f63c6">takes</tspan><tspan> </tspan><tspan>order</tspan><tspan> </tspan><tspan fill="#2f63c6">as</tspan><tspan> </tspan><tspan>Text</tspan></text>
    <text class="out" y="184" x="22" style="animation-name:o1_3"><tspan>    </tspan><tspan fill="#2f63c6">uses</tspan><tspan> </tspan><tspan>RefundAgent</tspan></text>
    <text class="out" y="205" x="22" style="animation-name:o1_4"><tspan>    </tspan><tspan fill="#2f63c6">do</tspan></text>
    <text class="out" y="226" x="22" style="animation-name:o1_5"><tspan>        </tspan><tspan>RefundAgent</tspan></text>
    <text class="out" y="247" x="22" style="animation-name:o1_6"><tspan>            </tspan><tspan fill="#2f63c6">with</tspan><tspan> </tspan><tspan>order</tspan><tspan> </tspan><tspan fill="#2f63c6">as</tspan><tspan> </tspan><tspan>order</tspan></text>
    <text y="268"><tspan x="22" fill="#2f63c6" font-weight="700">$</tspan><tspan x="37.6">touba run bypass.tb</tspan></text>
    <rect class="cover" x="36.6" y="253" width="153" height="21" style="animation-name:t1_7;transform:translateX(153px)"/>
    <text class="out" y="289" x="22" style="animation-name:o1_8"><tspan fill="#59636e">~/shop/bypass.tb:36:9-38:1: </tspan><tspan fill="#cf222e" font-weight="700">AgentCallerNotAllowed</tspan><tspan>: `strategy:shop.refunds/RefundEverything` cannot call</tspan></text>
    <text class="out" y="310" x="22" style="animation-name:o1_9"><tspan>agent `agent:shop.refunds/RefundAgent` without a matching `callable_by` rule</tspan></text>
  </g>
</svg>
