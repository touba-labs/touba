name: Bug report
description: Something in Touba does not behave as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. A minimal `.tb` program and the exact command usually make the difference.

        **Security vulnerabilities, leaked secrets or authority bypasses do not belong here.** Follow [SECURITY.md](https://github.com/touba-labs/touba/blob/dev/SECURITY.md) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the problem appear first?
      options:
        - Compiler and language
        - Runtime and execution
        - CLI commands
        - Project server and triggers
        - Packages and registry
        - JavaScript SDK
        - Python SDK
        - Traces, inspect and audit
        - Installation and updates
        - Editor extension and language server
        - Not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences, including any diagnostic code such as `AgentCallerNotAllowed`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands that shows the problem.
      placeholder: |
        1. touba compile repro.tb --out repro.air.json
        2. touba run repro.air.json --output trace
        3. ...
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Minimal program
      description: A short `.tb` source, or the relevant part of it. Remove private data first.
      placeholder: |
        module examples.repro

        strategy Repro
            do
                show
                    with message as "..."
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error or diagnostic when there is one.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Output of `touba version` and `touba doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux x64
        - Windows x64
        - Other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host application
      description: SDK and runtime versions, when a JavaScript or Python application is involved.
      placeholder: "Python 3.12, Touba Python SDK 1.5.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace excerpt
      description: Remove tokens, credentials and personal data before pasting.
      render: text
  - type: textarea
    id: impact
    attributes:
      label: Impact on your work
      description: Is this blocking, slowing you down or cosmetic?
