name: Documentation feedback
description: Something in the documentation is unclear, missing or inaccurate.
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link to the page on toubalang.org, or the path of the file in this repository.
      placeholder: https://toubalang.org/docs/...
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the page
      options:
        - English
        - French
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing or inaccurate. Quote the passage when you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: dropdown
    id: audience
    attributes:
      label: Who is affected?
      multiple: true
      options:
        - New user
        - Developer
        - Operator
        - Reviewer
        - Researcher
        - Other
