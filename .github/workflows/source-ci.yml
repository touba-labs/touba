name: Touba Source CI

on:
  pull_request:
  push:
    branches:
      - dev

concurrency:
  group: touba-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-build:
    name: source / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-full
            os: ubuntu-24.04
            suite: full

          - name: macos-intel-core
            os: macos-15-intel
            suite: core

          - name: macos-arm64-core
            os: macos-15
            suite: core

          - name: windows-x64-core
            os: windows-2025
            suite: core

    defaults:
      run:
        shell: bash
        working-directory: implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Show toolchains
        run: |
          node --version
          pnpm --version
          rustup show
          cargo --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Node version policy
        run: |
          pnpm check:node-version
          node --test tools/check-node-version.test.mjs

      - name: Grammar corpus
        run: pnpm --dir grammar/tree-sitter-touba test

      - name: Rust workspace tests
        run: |
          cargo test --locked
          cargo build --locked --bin touba-compile

      - name: Rust formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Redistribution notices
        run: pnpm test:third-party-notices

      - name: Runtime tests
        run: pnpm test:runtime

      - name: CLI tests
        run: pnpm test:cli

      - name: Setup Python SDK builder
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"

      - name: Install pinned Python build tools
        run: python -m pip install -r runtime/touba-python-sdk/build-requirements.txt

      - name: Installed Python SDK tests
        run: pnpm test:sdk-python

      - name: SDK and installed distribution tests
        run: |
          pnpm test:sdk
          pnpm test:distribution-sdk
          pnpm test:release-readiness

      - name: Published documentation sources
        if: matrix.suite == 'full'
        run: pnpm validate:docs-user

      - name: Release metadata tests
        run: pnpm test:distribution-release

      - name: Release versioning gate
        run: pnpm release:versioning

      - name: Linux full source validation
        if: matrix.suite == 'full'
        run: pnpm validate:v1-local

      - name: Linux local toolchain smoke
        if: matrix.suite == 'full'
        run: |
          pnpm package:touba-toolchain
          pnpm check:touba-toolchain
