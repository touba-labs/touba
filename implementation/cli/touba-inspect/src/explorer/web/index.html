<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src __CSP_SOURCE__; style-src __CSP_SOURCE__; connect-src 'self'; img-src __CSP_SOURCE__ blob:; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Touba Explorer</title>
  <link rel="stylesheet" href="__ASSET_tokens.css__">
  <link rel="stylesheet" href="__ASSET_style.css__">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 256 256" aria-hidden="true"><rect class="brand-plate" width="256" height="256" rx="56"/><path fill-rule="evenodd" d="M24 70Q24 61 31 56L62 33Q68 29 68 37V88H108V42Q108 32 118 32H138Q148 32 148 42V88H199Q232 88 232 121V179Q232 212 199 212H118Q108 212 108 202V124H68V166Q68 178 80 178H89Q94 178 94 183V207Q94 212 89 212H57Q24 212 24 179ZM148 124V178H181Q190 178 190 169V133Q190 124 181 124Z"/></svg>
      <div class="brand-text"><strong>Touba Explorer</strong><small id="project-name"></small></div>
    </div>
    <nav class="views" aria-label="Views">
      <button type="button" data-view="architecture" aria-pressed="true"><svg class="ui-icon" data-icon="architecture" aria-hidden="true"></svg><span data-i18n="architecture"></span></button>
      <button type="button" data-view="flow" aria-pressed="false"><svg class="ui-icon" data-icon="flow" aria-hidden="true"></svg><span data-i18n="flow"></span></button>
      <button type="button" data-view="governance" aria-pressed="false"><svg class="ui-icon" data-icon="governance" aria-hidden="true"></svg><span data-i18n="governance"></span></button>
    </nav>
    <div class="header-actions">
      <details id="diagnostics" hidden><summary><svg class="ui-icon" data-icon="alert" aria-hidden="true"></svg><span data-i18n="diagnostics"></span><span id="diagnostic-count" class="count-pill"></span></summary><ul></ul></details>
      <div id="status" role="status" aria-live="polite"></div>
      <span class="badge"><svg class="ui-icon" data-icon="lock" aria-hidden="true"></svg><span data-i18n="readonly"></span></span>
      <span class="language-field"><svg class="ui-icon" data-icon="globe" aria-hidden="true"></svg><select id="language" aria-label="Language" data-i18n-label="language"><option value="en">EN</option><option value="fr">FR</option></select><svg class="ui-icon caret" data-icon="caret" aria-hidden="true"></svg></span>
      <button id="theme" class="icon-button" type="button" aria-pressed="false"><svg class="ui-icon theme-to-dark" data-icon="moon" aria-hidden="true"></svg><svg class="ui-icon theme-to-light" data-icon="sun" aria-hidden="true"></svg></button>
    </div>
  </header>
  <main id="layout" data-resources="open" data-detail="open">
    <aside class="panel resources" id="resources-panel" aria-labelledby="resources-title">
      <div class="panel-head">
        <h2 id="resources-title" data-i18n="resources"></h2>
        <button id="hide-resources" class="icon-button ghost" type="button" data-i18n-label="hideResources" aria-controls="resources-panel"><svg class="ui-icon" data-icon="collapseLeft" aria-hidden="true"></svg></button>
      </div>
      <label for="search" class="sr-only" data-i18n="search"></label>
      <div class="search-field"><svg class="ui-icon" data-icon="search" aria-hidden="true"></svg><input id="search" type="search" autocomplete="off"></div>
      <details class="filters" id="filters" open>
        <summary><svg class="ui-icon" data-icon="filter" aria-hidden="true"></svg><span data-i18n="filters"></span><span id="filter-count" class="count-pill" hidden></span></summary>
        <div class="filter-grid">
          <label for="kind" data-i18n="kind"></label><select id="kind"></select>
          <label for="module" data-i18n="module"></label><select id="module"></select>
          <label for="package" data-i18n="package"></label><select id="package"></select>
          <label class="check"><input id="diagnostic-only" type="checkbox"><span data-i18n="diagnosticOnly"></span></label>
        </div>
      </details>
      <p id="count" class="muted"></p>
      <ul id="resource-list" aria-label="Resources"></ul>
    </aside>
    <section class="workspace" aria-label="Graph">
      <div class="toolbar">
        <button id="show-resources" class="icon-button" type="button" data-i18n-label="showResources" aria-controls="resources-panel" hidden><svg class="ui-icon" data-icon="panelLeft" aria-hidden="true"></svg></button>
        <label class="switch"><input id="group" type="checkbox" checked><span data-i18n="group"></span></label>
        <div class="field"><label for="direction" data-i18n="focus"></label><select id="direction"><option value="all" data-i18n="all"></option><option value="both" data-i18n="both"></option><option value="incoming" data-i18n="incoming"></option><option value="outgoing" data-i18n="outgoing"></option></select></div>
        <div class="field"><label for="depth" data-i18n="depth"></label><select id="depth"><option>1</option><option selected>2</option><option>3</option></select></div>
        <button id="reset" type="button"><svg class="ui-icon" data-icon="reset" aria-hidden="true"></svg><span data-i18n="reset"></span></button>
        <span class="spacer"></span>
        <div class="menu">
          <button id="display-toggle" type="button" aria-expanded="false" aria-controls="display-panel"><svg class="ui-icon" data-icon="sliders" aria-hidden="true"></svg><span data-i18n="display"></span></button>
          <div id="display-panel" class="popover" role="group" aria-labelledby="display-title" hidden>
            <p id="display-title" class="popover-title" data-i18n="display"></p>
            <p class="option-label" data-i18n="edgeLabels"></p>
            <div class="segmented" data-pref="labels"><button type="button" data-value="all" data-i18n="labelsAll"></button><button type="button" data-value="auto" data-i18n="labelsAuto"></button><button type="button" data-value="none" data-i18n="labelsNone"></button></div>
            <p class="option-label" data-i18n="orientation"></p>
            <div class="segmented" data-pref="orientation"><button type="button" data-value="vertical" data-i18n="vertical"></button><button type="button" data-value="horizontal" data-i18n="horizontal"></button></div>
            <p class="option-label" data-i18n="density"></p>
            <div class="segmented" data-pref="density"><button type="button" data-value="comfortable" data-i18n="comfortable"></button><button type="button" data-value="compact" data-i18n="compact"></button></div>
            <p class="option-label" data-i18n="panels"></p>
            <div class="segmented" data-pref="panels"><button type="button" data-value="resources" data-i18n="resourcesShort"></button><button type="button" data-value="detail" data-i18n="inspector"></button></div>
            <p class="hint" data-i18n="shortcuts"></p>
          </div>
        </div>
        <button id="focus-mode" class="icon-button" type="button" aria-pressed="false" data-i18n-label="focusMode"><svg class="ui-icon" data-icon="expand" aria-hidden="true"></svg></button>
        <button id="show-detail" class="icon-button" type="button" data-i18n-label="showDetails" aria-controls="detail-panel" hidden><svg class="ui-icon" data-icon="panelRight" aria-hidden="true"></svg></button>
      </div>
      <div id="canvas-wrap">
        <svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graph-title"><title id="graph-title">Touba project graph</title><g id="drawing"></g></svg>
        <p id="empty"></p>
        <div id="legend" class="legend"></div>
        <div class="graph-actions">
          <button id="zoom-out" class="icon-button" type="button" data-i18n-label="zoomOut"><svg class="ui-icon" data-icon="minus" aria-hidden="true"></svg></button>
          <button id="fit" type="button"><svg class="ui-icon" data-icon="fit" aria-hidden="true"></svg><span data-i18n="fit"></span></button>
          <button id="zoom-in" class="icon-button" type="button" data-i18n-label="zoomIn"><svg class="ui-icon" data-icon="plus" aria-hidden="true"></svg></button>
          <span class="separator" aria-hidden="true"></span>
          <button id="fullscreen" class="icon-button" type="button" data-i18n-label="fullscreen"><svg class="ui-icon" data-icon="fullscreen" aria-hidden="true"></svg></button>
          <button id="export" type="button" data-i18n-label="exportSvg"><svg class="ui-icon" data-icon="download" aria-hidden="true"></svg><span>SVG</span></button>
          <button id="export-png" type="button" data-i18n-label="exportPng"><span>PNG</span></button>
        </div>
      </div>
    </section>
    <aside class="panel detail-panel" id="detail-panel" aria-labelledby="detail-heading">
      <div class="panel-head">
        <span id="detail-heading" class="eyebrow" data-i18n="inspector"></span>
        <button id="hide-detail" class="icon-button ghost" type="button" data-i18n-label="hideDetails" aria-controls="detail-panel"><svg class="ui-icon" data-icon="collapseRight" aria-hidden="true"></svg></button>
      </div>
      <div id="detail" aria-live="polite"></div>
    </aside>
  </main>
  <dialog id="source-dialog"><header><strong id="source-title"></strong><button id="close-source" type="button" data-i18n="close"></button></header><pre id="source-code"></pre></dialog>
  <script type="module" src="__ASSET_app.mjs__"></script>
</body>
</html>
