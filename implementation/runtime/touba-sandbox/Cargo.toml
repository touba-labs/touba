[package]
name = "touba-sandbox"
version = "1.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Isolation", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_JobObjects",
  "Win32_System_Memory", "Win32_System_Threading",
  "Win32_System_WindowsProgramming", "Win32_System_SystemServices",
  "Win32_System_Environment", "Win32_System_SystemInformation"
] }
